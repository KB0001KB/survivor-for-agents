<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幸存者</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d;
    --text:#c9d1d9; --dim:#8b949e; --accent:#58a6ff;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Consolas","Courier New",monospace;
    font-size:14px; line-height:1.5;
    user-select:none; overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* 上半：界面。AI 只截这一块。 */
  #ui{ flex:none; position:relative; z-index:2; }

  /* 下半：场景。给人看的。 */
  #scene{
    flex:1; min-height:220px; position:relative; overflow:hidden;
    background:#070a0e; border-top:1px solid var(--line);
  }
  #scene svg{ position:absolute; inset:0; display:block; width:100%; height:100%; }
  #tip{
    position:fixed; display:none; z-index:50; pointer-events:none;
    padding:3px 10px; border-radius:5px; font-size:12.5px; line-height:1.4;
    background:#0d1117; color:var(--text); border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(0,0,0,.6); white-space:nowrap;
  }
  #tip b{ color:var(--accent); }

  #grid{
    position:fixed; inset:0; pointer-events:none; z-index:999;
    background-image:
      linear-gradient(to right, rgba(120,170,255,.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(120,170,255,.07) 1px, transparent 1px);
    background-size:100px 100px;
  }
  #grid::after{
    content:"100px"; position:absolute; left:4px; bottom:2px;
    font-size:9px; color:rgba(120,170,255,.35);
  }

  #bar{
    height:44px; display:flex; align-items:center; gap:18px;
    padding:0 12px; background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .res{display:flex; align-items:baseline; gap:6px; min-width:96px;}
  .res .k{color:var(--dim); font-size:12px;}
  .res .d{ font-size:10px; color:var(--dim); }
  .res .v{font-size:15px; font-weight:bold;}
  .v.ok{color:var(--ok);} .v.warn{color:var(--warn);} .v.bad{color:var(--bad);}

  #pause{
    margin-left:auto; width:32px; height:32px; flex:none;
    background:#21262d; border:1px solid var(--line); color:var(--text);
    border-radius:4px; cursor:pointer; font-size:14px;
  }
  #pause:hover{background:#30363d;}

  #meta{
    height:34px; display:flex; align-items:center; gap:20px;
    padding:0 12px; background:#0f141b;
    border-bottom:1px solid var(--line); color:var(--dim); font-size:13px;
  }
  #points{color:var(--accent);}

  #people{
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:10px; padding:12px; height:190px;
  }
  .person{
    background:var(--panel); border:1px solid var(--line);
    border-radius:6px; padding:10px; display:flex; flex-direction:column; gap:6px;
  }
  .person.dead{opacity:.35;}
  .person .name{font-size:15px; font-weight:bold;}
  .person .trait{ color:var(--dim); font-size:12px; }
  .bar{ height:6px; background:#21262d; border-radius:3px; overflow:hidden; }
  .bar > i{ display:block; height:100%; width:0%; background:var(--ok); transition:width .2s; }
  .person .st{ font-size:12px; color:var(--dim); }
  .person.can-talk{ cursor:pointer; }
  .person.can-talk:hover{ border-color:var(--accent); }
  .person .bondv{ color:var(--accent); font-size:12px; font-weight:normal; }
  .person .bar.bond{ height:3px; margin-top:2px; }
  .person .wish{ color:var(--warn); font-size:12px; line-height:1.4; }
  .person .wishbtn{
    margin-top:4px; height:26px; font-size:12px;
    background:#21262d; border:1px solid var(--warn); color:var(--warn);
    border-radius:4px; cursor:pointer; font-family:inherit;
  }
  .person .wishbtn:hover{ background:#30363d; }

  #actions{
    display:grid; grid-template-columns:repeat(9,1fr);
    gap:8px; padding:0 12px 12px;
  }
  button.act, #next{
    height:84px; background:#21262d; border:1px solid var(--line);
    color:var(--text); border-radius:6px; cursor:pointer;
    font-family:inherit; font-size:13px;
  }
  button.act:hover:not(:disabled), #next:hover{background:#30363d; border-color:var(--accent);}
  button.act:disabled, #next:disabled{opacity:.35; cursor:not-allowed;}
  button.act small{display:block; color:var(--dim); font-size:11px; margin-top:2px;}

  #next{
    width:100%; height:44px; margin:0 12px 12px; width:calc(100% - 24px);
    border-color:var(--accent); color:var(--accent); font-size:15px;
  }

  #night{
    margin:0 12px 6px; height:34px; display:flex; align-items:center; gap:10px;
    padding:0 12px; border-radius:6px; font-size:12.5px;
    background:#1a1508; border:1px solid #4a3a12; color:var(--warn);
  }
  #night.hide{ visibility:hidden; }
  #night .fix{
    margin-left:auto; height:24px; padding:0 12px; cursor:pointer;
    background:#2a2110; border:1px solid var(--warn); color:var(--warn);
    border-radius:4px; font-family:inherit; font-size:12px;
  }
  #night .fix:disabled{ opacity:.35; cursor:not-allowed; }

  #log{
    margin:0 12px 12px; height:76px; overflow-y:auto;
    background:#0b0f14; border:1px solid var(--line); border-radius:6px;
    padding:10px; font-size:12.5px; line-height:1.7;
  }
  #log div{border-bottom:1px solid #141a21; padding:2px 0;}
  #log .t{color:var(--dim); margin-right:8px;}
  #log .bad{color:var(--bad);} #log .ok{color:var(--ok);} #log .warn{color:var(--warn);}
  #log .sys{color:var(--accent);}
  #log .dim{color:#6e7681;}

  #quit{
    margin-left:auto; height:26px; padding:0 10px;
    background:#21262d; border:1px solid var(--line); color:var(--dim);
    border-radius:4px; cursor:pointer; font-family:inherit; font-size:12px;
  }
  #quit:hover{ border-color:var(--warn); color:var(--warn); }

  #choice{
    position:fixed; inset:0; background:rgba(0,0,0,.82);
    display:none; align-items:center; justify-content:center;
  }
  #choice.show{ display:flex; }
  #choice .box{ width:520px; }
  #choice .choices{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
  #choice .choices button{
    background:#21262d; border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:10px; cursor:pointer; font-family:inherit; text-align:left;
  }
  #choice .choices button:hover{ border-color:var(--accent); }
  #choice .choices small{ display:block; color:var(--dim); font-size:11px; margin-top:4px; }
  #choice .cancel{
    background:none; border:none; color:var(--dim); cursor:pointer; font-family:inherit;
    text-decoration:underline;
  }
  #choice .restart{
    display:block; width:100%; margin-bottom:10px;
    background:none; border:1px solid #4a2a2a; color:#a06060;
    border-radius:6px; padding:8px; cursor:pointer; font-family:inherit; font-size:12px;
  }
  #choice .restart:hover{ border-color:var(--bad); color:var(--bad); }
  #choiceMsg{ min-height:18px; color:var(--bad); font-size:12px; margin-bottom:10px; }

  #ask{
    position:fixed; inset:0; background:rgba(0,0,0,.78); display:none;
    align-items:center; justify-content:center; z-index:60;
  }
  #ask.show{ display:flex; }
  #ask .box{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:26px 32px; max-width:460px; text-align:center;
  }
  #ask #askText{ color:var(--text); line-height:1.8; margin-bottom:10px; }
  #ask .note{ color:var(--bad); font-size:12px; margin-bottom:20px; }
  #ask .row{ display:flex; gap:12px; justify-content:center; }
  #ask button{
    height:34px; padding:0 22px; border-radius:6px; cursor:pointer;
    font-family:inherit; font-size:13px;
    background:#21262d; border:1px solid var(--line); color:var(--text);
  }
  #ask #askOk{ border-color:var(--bad); color:var(--bad); }
  #ask button:hover{ background:#30363d; }
  .mach{ cursor:pointer; transition:filter .15s, opacity .3s; }
  .mach:hover{ filter:brightness(1.4); }
  .mach.dead{ opacity:.4; filter:grayscale(1); pointer-events:none; }

  #over{
    position:fixed; inset:0; background:rgba(0,0,0,.82);
    display:none; align-items:center; justify-content:center;
  }
  #over.show{display:flex;}
  #over .box{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:28px 36px; text-align:center; max-width:520px;
  }
  #over h2{font-size:20px; margin-bottom:12px;}
  #over p{color:var(--dim); margin-bottom:18px; line-height:1.8;}
  #over button{
    background:#21262d; border:1px solid var(--accent); color:var(--accent);
    border-radius:6px; padding:8px 20px; cursor:pointer; font-family:inherit;
  }

  #awake{
    position:fixed; inset:0; background:rgba(0,0,0,.88);
    display:none; align-items:flex-start; justify-content:center;
    padding-top:56px; z-index:40;
  }
  #awake.show{display:flex;}
  #awake .box{
    background:var(--panel); border:1px solid var(--accent); border-radius:10px;
    padding:22px 30px; width:min(720px,90vw); max-height:460px;
    display:flex; flex-direction:column;
  }
  #awake h2{font-size:19px; margin-bottom:6px; color:var(--accent);}
  #awake .sub{color:var(--dim); font-size:12px; margin-bottom:12px; line-height:1.7;}
  #awakeList{ overflow:auto; min-height:0; }
  #awake .r{padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:1.7;}
  #awake .r:last-child{border-bottom:none;}
  #awake .r .w{color:var(--bad);}
  #awake .r .ok{color:var(--ok);}
  #awake button{
    flex:none; align-self:flex-start;
    background:#21262d; border:1px solid var(--accent); color:var(--accent);
    border-radius:6px; padding:8px 22px; cursor:pointer; font-family:inherit;
    margin-top:14px;
  }
</style>
</head>
<body>

<div id="grid"></div>

<div id="ui">

<div id="bar">
  <div class="res"><span class="k">氧气</span><span class="v" id="r-oxygen">100</span><span class="d" id="d-oxygen"></span></div>
  <div class="res"><span class="k">水</span><span class="v" id="r-water">100</span><span class="d" id="d-water"></span></div>
  <div class="res"><span class="k">食物</span><span class="v" id="r-food">100</span><span class="d" id="d-food"></span></div>
  <div class="res"><span class="k">电力</span><span class="v" id="r-power">100</span><span class="d" id="d-power"></span></div>
  <div class="res"><span class="k">材料</span><span class="v" id="r-material">200</span><span class="d" id="d-material"></span></div>
  <div class="res"><span class="k">士气</span><span class="v" id="r-morale">100</span><span class="d" id="d-morale"></span></div>
  <button id="pause" title="暂停">⏸</button>
</div>

<div id="meta">
  <span>第 <b id="day">1</b> 天</span>
  <span>行动点 <b id="points">4</b></span>
  <span id="tech"></span>
  <span id="hint"></span>
  <button id="quit">宣布结束</button>
</div>

<div id="people"></div>

<div id="actions"></div>

<button id="next">结束今天</button>

<div id="night" class="hide"><span id="nightTx"></span><button class="fix" id="nightBtn"></button></div>
<div id="log"></div>

</div><!-- /#ui -->

<div id="scene"><svg id="sceneSvg" viewBox="0 0 1264 320" preserveAspectRatio="xMidYMax slice"></svg></div>
<div id="tip"></div>

<div id="choice"><div class="box">
  <h2>宣布结束</h2>
  <p>这不是失败。选一种收尾就行。</p>
  <div class="choices">
    <button data-c="evac">撤离<small>带一部分人走（40 电 / 60 材料）</small></button>
    <button data-c="seal">封存<small>冻起来等以后（60 电）</small></button>
    <button data-c="log">留档<small>把这段日子写完</small></button>
    <button data-c="stop">停在这里<small>不解释</small></button>
  </div>
  <div id="choiceMsg"></div>
  <button class="restart" data-c="restart">重新开始这一局（现在这些人会没）</button>
  <button class="cancel" data-c="cancel">算了，继续</button>
</div></div>

<div id="ask"><div class="box">
  <p id="askText"></p>
  <div class="note" id="askNote"></div>
  <div class="row"><button id="askOk">拆</button><button id="askNo">算了</button></div>
</div></div>

<div id="over"><div class="box">
  <h2 id="over-title"></h2>
  <p id="over-text"></p>
  <button onclick="location.reload()">再来一局</button>
</div></div>

<div id="awake"><div class="box">
  <h2>他们等到了。</h2>
  <p class="sub">外面还是黑的。从今天起，这屋子自己会活。</p>
  <div id="awakeList"></div>
  <button id="awakeOk">合上这本子</button>
</div></div>

<script>
"use strict";

// ---------- 可调数值，全在这儿 ----------
const BAL = {
  start: { oxygen: 100, water: 100, food: 100, power: 100, material: 200, morale: 100 },
  drain: { oxygen: 25, water: 22, food: 25, power: 15 },
  stressPerDay: 5,
  pointsPerDay: 4,
  deathOxygenDays: 2,
  techPerLevel: 3,
  revealAt: 24,
};

const ACTIONS = [
  { id:"oxy",  name:"修氧机", sub:"+30 氧 / -10 材料 / -8 电", run(s){
      const gain = 30 + (G.techLevel >= 1 ? 10 : 0);
      s.oxygen += gain; s.material -= 10; s.power -= 8;
      return "修了氧机，氧气 +" + gain + "，材料 -10，电力 -8";
  }},
  { id:"water",name:"打水", sub:"+30 水 / -6 电", run(s){
      s.water += 30; s.power -= 6;
      return "打了水，水 +30，电力 -6";
  }},
  { id:"farm", name:"种植", sub:"+30 食物 / -8 水", run(s){
      s.food += 30; s.water -= 8;
      return "种了一批，食物 +30，水 -8";
  }},
  { id:"power",name:"发电", sub:"+30 电 / -15 材料", run(s){
      const gain = 30 + (G.techLevel >= 2 ? 10 : 0);
      s.power += gain; s.material -= 15;
      return "烧料发电，电力 +" + gain + "，材料 -15";
  }},
  { id:"mine", name:"挖矿", sub:"+40 材料 / 全员压力 +8", run(s, g){
      s.material += 40;
      g.survivors.forEach(p => { if (p.alive) p.stress += 8; });
      return "挖矿，材料 +40，所有人压力 +8";
  }},
  { id:"rest", name:"休息", sub:"一人 -25 压力", run(s, g){
      const p = mostStressed();
      if (!p) return "没人需要休息";
      p.stress = Math.max(0, p.stress - 25);
      return p.name + " 去躺了一会儿，压力 -25";
  }},
  { id:"talk", name:"聊天", sub:"全员 -10 压力", run(s, g){
      g.survivors.forEach(p => { if (p.alive) p.stress = Math.max(0, p.stress - 10); });
      return "大家凑在一起说了会儿话，所有人压力 -10";
  }},
  { id:"apply",name:"应用研究", sub:"-15 材料 / +1 科技", run(s){
      s.material -= 15;
      G.tech += 1;
      const need = BAL.techPerLevel;
      if (G.tech >= need && G.techLevel < 3) {
        G.tech -= need;
        G.techLevel += 1;
        const what = ["修氧机效率提升", "发电机效率提升", "每日消耗降低"][G.techLevel - 1];
        return "改成了一版设计：" + what + "。（科技 " + G.techLevel + " 级）";
      }
      return "拆了改、改了拆，攒了点东西。科技 +1（" + G.tech + "/" + need + "）";
  }},
  { id:"study",name:"基础理论", sub:"-12 材料", run(s){
      s.material -= 12;
      G.theory += 1;
      G.theoryTotal += 1;
      saveGame();
      return "在「基础理论」上花了点时间。没什么用，也看不出进展。";
  }},
];

const NAMES = [
  {
    name: "阿岩", trait: "懒", wishId: "sleep",
    wish: "想睡一整天，睡到自然醒",
    wishLine: "我不想干活了。我就想睡一整天，睡到自然醒，谁也别叫我。",
    lines: ["今天能少干点吗。", "我睡一会儿，就一会儿。", "这床硬得像石头。", "上面到底几点，我都不知道了。"],
  },
  {
    name: "小满", trait: "爱干净", wishId: "bath",
    wish: "想洗个热水澡",
    wishLine: "我想洗个热水澡。真的，从头到脚，热的那种。这里的水永远凉。",
    lines: ["这地方总能擦干净，只要有人愿意擦。", "我梦见洗澡了。", "水别乱用，我心疼。", "你身上有味儿了，我不嫌弃。"],
  },
  {
    name: "石头", trait: "胆小", wishId: "signal",
    wish: "想知道外面还有没有活人",
    wishLine: "我想知道上面还有没有人。不是我非要出去，我就是想有个数。",
    lines: ["上面还有动静吗。", "我总听见有人在墙里走路。", "你别走太远。", "有时候我觉得氧气声像呼吸。"],
  },
  {
    name: "阿豆", trait: "什么都吃", wishId: "noodle",
    wish: "想吃一碗有肉的面",
    wishLine: "我想吃一碗有肉的面。不用多，就一碗。你们随便笑话我。",
    lines: ["我梦见面条了。", "这个能吃吗？我就是问问。", "饿的时候我什么都想得出来。", "你把最后那口省给了别人，我看见了。"],
  },
  {
    name: "老周", trait: "沉默", wishId: "radio",
    wish: "想听一次收音机里的老歌",
    wishLine: "我想听一次收音机。随便什么歌都行，只要是人在唱。",
    lines: ["……", "嗯。", "我以前话比现在多。", "你们说，我听着。"],
  },
  {
    name: "阿丁", trait: "急性子", wishId: "run",
    wish: "想跑一次，真的跑起来",
    wishLine: "我想跑一次。就在这条走廊里，跑到底再跑回来，跑到喘不上气。",
    lines: ["这地方连走路都嫌窄。", "快点，行不行。", "我腿都僵了。", "你别慢吞吞的。"],
  },
  {
    name: "阿雀", trait: "话多", wishId: "tell",
    wish: "想有人把一件事听完",
    wishLine: "我有一件事，从头到尾没跟人说完过。你能不能就听我说完，别打断。",
    lines: ["我跟你说个事儿。", "你别嫌我烦。", "上次说到哪儿了？", "你听我说话了吗。"],
  },
  {
    name: "老韩", trait: "记性好", wishId: "record",
    wish: "想把这些日子记下来",
    wishLine: "我想把这段日子写下来。谁死了，谁说了什么。省得以后没人知道。",
    lines: ["我记着呢。", "第七天，水少了一桶。", "你上次说那句话，我记下来了。", "人总得留点什么。"],
  },
];
const WISH_COST = {
  sleep: {
    label: "让他睡一整天", need: "1 个行动点",
    can: (s, g) => g.points > 0,
    apply: (s, g) => { g.points -= 1; },
    done: "他真的睡了一整天，没人叫他。醒来的时候，天已经黑过第二遍。",
    leave: "他说想出去走走，找张真正软的床。",
  },
  bath: {
    label: "烧一桶热水", need: "水 40 / 电 20",
    can: (s) => s.water >= 40 && s.power >= 20,
    apply: (s) => { s.water -= 40; s.power -= 20; },
    done: "水烧了很久。她把门关上，谁也没问里面。",
    leave: "她出来的时候头发是湿的，说想去找个有水的地方。",
  },
  signal: {
    label: "修好通讯器", need: "材料 60 / 电 30",
    can: (s) => s.material >= 60 && s.power >= 30,
    apply: (s) => { s.material -= 60; s.power -= 30; },
    done: "通讯器响了三次，第三次有人回话。对面说的是听不懂的方言，但那是活人。",
    leave: "他记下了那个方向。第二天早上，他的床空了。",
  },
  noodle: {
    label: "做一碗有肉的面", need: "食物 50",
    can: (s) => s.food >= 50,
    apply: (s) => { s.food -= 50; },

function grantWish(i) {
  const p = G.survivors[i];
  if (!p || !p.alive || !p.wishKnown || p.left) return;
  const c = WISH_COST[p.wishId];
  if (!c) return;
  if (!c.can(G.res, G)) { log("现在还办不到：" + c.need, "warn"); return; }
  c.apply(G.res, G);
  clampAll();
  p.left = true;
  p.alive = false;
  log(c.done, "ok");
  log(c.leave, "ok");
  G.survivors.forEach(q => {
    if (q.alive) {
      q.stress = Math.max(0, q.stress - 8);
      q.bond = Math.min(100, q.bond + 5);
    }
  });
  log("其他人看着他走。所有人压力 -8，也没那么怕了。", "");
  checkEnd();
  render();
}

function checkEnd() {
  if (alive().length > 0) return false;
  const gone = G.survivors.filter(p => p.left).length;
  if (gone >= G.survivors.length) {
    end("都走了", "第 " + G.day + " 天。四个人都圆满了，没有一个人留下。");
  } else {
    end("全灭了", "最后一天是第 " + G.day + " 天。没有人活下来。");
  }
  return true;
}

function loadRun() {
  try {
    const raw = localStorage.getItem(RUN_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw.replace(/^\uFEFF/, ""));
    if (d.v !== 1 || d.over) return false;
    if (!Array.isArray(d.sur) || d.sur.length !== 4) return false;
    G.day = d.day;
    G.points = d.points;
    G.res = d.res;
    G.survivors = d.sur;
    G.theory = d.theory || 0;
    G.tech = d.tech || 0;
    G.techLevel = d.techLevel || 0;
    G.oxygenDays = d.oxygenDays || 0;
    G.foodDays = d.foodDays || 0;
    G.waterDays = d.waterDays || 0;
    G.rollCallPending = !!d.rollCallPending;
    G.lastOneLogged = !!d.lastOneLogged;
    G.awakened = !!d.awakened;
    G.posts = Array.isArray(d.posts) ? d.posts : [null, null, null, null];
    G.badStreak = d.badStreak || 0;
    G.remedy = d.remedy || null;
    G.broken = d.broken || {};
    G.log = d.log || [];
    G.over = false;
    return true;
  } catch (e) {
    return false;
  }
}

  const who = G.survivors[i];
  if (!g || !tip || !who) return;
  const st = !who.alive ? (who.left ? " · 走了" : " · 床空着")
    : who.stress >= 60 ? " · 绷得很紧" : who.stress >= 30 ? " · 有点累" : "";
  tip.innerHTML = "<b>" + escapeHtml(who.name) + "</b>" + st;
  tip.style.display = "block";
  const b = g.getBoundingClientRect();
  const x = b.left + b.width / 2 - tip.offsetWidth / 2;
  tip.style.left = Math.max(8, Math.min(innerWidth - tip.offsetWidth - 8, x)) + "px";
  tip.style.top = (b.top - 22) + "px";
}

  const posts = G.posts || [];

  // 制氧机
  const oxyC = lv(s.oxygen);
  $("oRing").setAttribute("stroke", oxyC);
  $("oFan").setAttribute("stroke", oxyC);
  $("oFan").setAttribute("class", "fan" + (s.oxygen <= 15 ? " stop" : s.oxygen <= 35 ? " slow" : ""));

  // 农田
  $("crop").setAttribute("stroke", lv(s.food));

  // 水箱
  const wH = Math.max(0, Math.min(154, Math.round(154 * Math.min(100, s.water) / 100)));
  const wy = 265 - wH;
  $("wBody").setAttribute("y", wy);
  $("wBody").setAttribute("height", wH);
  $("wWave").setAttribute("d", wH > 3 ? "M507 " + wy + " q 39 -6 78 0 t 78 0" : "");

  // 发电机
  const powC = lv(s.power);
  $("pRing").setAttribute("stroke", powC);
  $("pFan").setAttribute("stroke", powC);
  $("pFan").setAttribute("class", "fan" + (s.power <= 15 ? " stop" : s.power <= 35 ? " slow" : ""));

  // 矿道
  $("crack").style.display = s.material <= 15 ? "" : "none";

  // 拆掉的机器留在那儿，灰了
  ["farm", "water", "power"].forEach(function (k) {
    const g = $("m-" + k);
    if (g) g.classList.toggle("dead", !!G.broken[k]);
  });

  // 人
  G.survivors.forEach(function (who, i) {
    const g = $("who" + i);
    if (!g) return;
    const art = g.querySelector(".art");
    const post = posts[i] && SCENE.posts[posts[i]];
    const x = post || SCENE.slots[i];
    const nm = $("nm" + i);
    const bob = g.querySelector(".bob");
    const bed = $("bed" + i);

    if (!who.alive) {
      bob.style.display = "none";
      bed.style.display = "";
      nm.textContent = who.left ? "走了" : "空床";
      nm.setAttribute("fill", "#4b5563");
      art.style.transform = "scale(1)";
      g.style.transform = "translate(" + x + "px," + G0 + "px)";
      return;
    }
    bob.style.display = "";
    bed.style.display = "none";
    nm.textContent = who.name;
    nm.setAttribute("fill", "#9aa4b1");

    const st = who.stress;
    const lean = st >= 60 ? 9 : st >= 30 ? 4 : 0;
    const id = FOLK_ID[who.name] || "ayan";
    const src = "assets/folk/" + id + (posts[i] ? "-work" : "") + ".png";
    const spr = g.querySelector(".spr");
    if (spr && spr.getAttribute("href") !== src) spr.setAttribute("href", src);
    g.classList.toggle("hot", st >= 60);
    art.style.transform = "rotate(" + lean + "deg)";
    g.style.transform = "translate(" + x + "px," + G0 + "px)";
  });

  // 气泡
  const bub = $("bub");
  const b = lastBubble();
  const idx = b ? G.survivors.findIndex(q => q.name === b.who) : -1;
  if (idx < 0 || !G.survivors[idx].alive) { bub.style.display = "none"; return; }
  let say = b.say;
  if (say.length > 20) say = say.slice(0, 20) + "…";
  const post = posts[idx] && SCENE.posts[posts[idx]];
  const x = post || SCENE.slots[idx];
  const bw = Math.max(84, say.length * 13 + 24);
  const bx = Math.max(10, Math.min(1264 - bw - 10, x - bw / 2));
  const by = 150;
  $("bubR").setAttribute("x", bx);
  $("bubR").setAttribute("y", by);
  $("bubR").setAttribute("width", bw);
  $("bubT").setAttribute("d",
    "M" + (x - 6) + " " + (by + 27) + " L" + x + " " + (by + 40) + " L" + (x + 6) + " " + (by + 27) + " Z");
  $("bubX").setAttribute("x", bx + bw / 2);
  $("bubX").setAttribute("y", by + 19);
  $("bubX").textContent = say;
  bub.style.display = "";
}

function renderScene() {
  if (!SCENE.built) {
    buildScene();
    SCENE.built = true;
    const svg = document.getElementById("sceneSvg");
    svg.classList.add("nofx");
    updateScene();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { svg.classList.remove("nofx"); });
    });
    return;
  }
  updateScene();
}

// ---------- 渲染 ----------
function clampAll() {
  const s = G.res;
  for (const k of Object.keys(s)) {
    s[k] = Math.max(0, Math.min(999, Math.round(s[k])));
  }
}

function colorOf(v) {
  if (v <= 15) return "bad";
  if (v <= 35) return "warn";
  return "ok";
}

function render() {
  const s = G.res;
  for (const k of ["oxygen","water","food","power","material","morale"]) {
    const el = document.getElementById("r-" + k);
    el.textContent = s[k];
    el.className = "v " + (k === "material" ? "" : colorOf(s[k]));
  }
  const popf = Math.max(1, alive().length) / 4;
  const dm = popf * (G.awakened ? 0.3 : (G.techLevel >= 3 ? 0.85 : 1));
  [["oxygen", BAL.drain.oxygen], ["water", BAL.drain.water],
   ["food", BAL.drain.food], ["power", BAL.drain.power]].forEach(function (pair) {
    const el = document.getElementById("d-" + pair[0]);
    if (el) el.textContent = "-" + Math.round(pair[1] * dm) + "/天";
  });
  document.getElementById("day").textContent = G.day;
  document.getElementById("points").textContent = G.points;
  document.getElementById("tech").textContent =
    "科技 " + G.techLevel + " 级" + (G.tech > 0 ? "（" + G.tech + "/" + BAL.techPerLevel + "）" : "");

  const people = document.getElementById("people");
  people.innerHTML = G.survivors.map((p, i) => {
    const w = Math.min(100, p.stress);
    const c = w >= 80 ? "var(--bad)" : w >= 50 ? "var(--warn)" : "var(--ok)";
    let st = !p.alive ? (p.left ? "走了" : "床空着") : p.stress >= 60 ? "绷得很紧" : p.stress >= 30 ? "有点累" : "还行";
    if (p.alive && p.bond < 30) st += " · 不太信你";
    const b = Math.round(p.bond);
    const canTalk = p.alive && !p.talked && !G.over && !G.paused;
    return '<div class="person ' + (p.alive ? "" : "dead") + (canTalk ? " can-talk" : "") +
      '" data-i="' + i + '">' +
      '<div class="name">' + p.name + ' <span class="bondv">' + b + '</span></div>' +
      '<div class="trait">' + p.trait + (p.talked && p.alive ? " · 今天聊过了" : "") + '</div>' +
      '<div class="bar"><i style="width:' + w + '%;background:' + c + '"></i></div>' +
      '<div class="st">压力 ' + w + ' · ' + st + '</div>' +
      '<div class="bar bond"><i style="width:' + b + '%;background:var(--accent)"></i></div>' +
      (p.wishKnown ? '<div class="wish">愿望：' + p.wish + '</div>' : '') +
      (p.wishKnown && p.alive && !p.left
        ? '<button class="wishbtn" data-w="' + i + '">' + WISH_COST[p.wishId].label + '</button>'
        : '') +
      '</div>';
  }).join("");
  people.querySelectorAll(".person.can-talk").forEach(el => {
    el.addEventListener("click", () => talkTo(Number(el.dataset.i)));
  });
  people.querySelectorAll(".wishbtn").forEach(b => {
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      grantWish(Number(b.dataset.w));
    });
  });

  const acts = document.getElementById("actions");
  acts.innerHTML = ACTIONS.map(a =>
    '<button class="act" data-id="' + a.id + '"' + (canAct() && !(G.broken && G.broken[a.id]) ? "" : " disabled") + '>' +
    a.name + '<small>' + a.sub + '</small></button>'
  ).join("");
  acts.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => doAction(b.dataset.id));
  });

  document.getElementById("next").disabled = G.over || G.paused;
  document.getElementById("pause").textContent = G.paused ? "▶" : "⏸";
  document.getElementById("hint").textContent = G.paused ? "已暂停" : "";
  renderLog();
  renderRemedy();
  renderAsk();
  renderScene();
  saveRun();
}

function canAct() {
  return !G.over && !G.paused && G.points > 0;
}

// ---------- 和一个人说话 ----------
function talkTo(i) {
  const p = G.survivors[i];
  if (!p || !p.alive || p.talked || G.over || G.paused) return;
  p.talked = true;
  p.stress = Math.max(0, p.stress - 4);
  p.bond = Math.min(100, p.bond + 3);
  const line = p.lines[Math.floor(Math.random() * p.lines.length)];
  log(p.name + "：" + line, "");
  if (!p.wishKnown && p.bond >= 80) {
    p.wishKnown = true;
    log(p.name + "：" + p.wishLine, "ok");
    log("（他第一次说了自己想要什么。）", "ok");
  }
  render();
}

// ---------- 行动 ----------
function doAction(id) {
  if (!canAct()) return;
  const a = ACTIONS.find(x => x.id === id);
  if (!a) return;
  const text = a.run(G.res, G);
  G.points -= 1;
  clampAll();
  log(text, a.id === "study" ? "sys" : "");
  sendToWork(id);
  render();
}

// 画面上的走位：派一个闲着的人去这个工位。只影响画，不影响数值。
const WORK_POST = { oxy: "oxygen", farm: "farm", water: "water", power: "power", mine: "mine" };
function sendToWork(id) {
  const post = WORK_POST[id];
  if (!post) return;
  if (!G.posts) G.posts = [null, null, null, null];
  for (let i = 0; i < G.survivors.length; i++) {
    const p = G.survivors[i];
    if (p.alive && !G.posts[i]) { G.posts[i] = post; return; }
  }
}

function pickTrait(t) {
  const a = alive().filter(p => p.trait === t);
  return a.length ? a[Math.floor(Math.random() * a.length)] : null;
}

// 从指定种类的池子里按权重抽一条
function pickEvent(kind) {
  const pool = kind ? EVENTS.filter(e => e.kind === kind) : EVENTS;
  const total = pool.reduce((s, e) => s + e.w, 0);
  let r = Math.random() * total;
  for (let k = 0; k < pool.length; k++) {
    r -= pool[k].w;
    if (r <= 0) return pool[k];
  }
  return pool[pool.length - 1];
}

function rollEvent() {
  if (G.awakened) return;
  if (Math.random() > 0.38) return;

  // 连着两次倒霉，第三次强制给件好事
  const forced = (G.badStreak || 0) >= 2 ? "good" : null;
  if (forced) G.badStreak = 0;

  const e = pickEvent(forced);
  const text = e.run();
  if (text) log(text, e.kind === "bad" ? "warn" : e.kind === "good" ? "ok" : "dim");
  if (!forced) {
    if (e.kind === "bad") G.badStreak = (G.badStreak || 0) + 1;
    else G.badStreak = 0;
  }
  clampAll();
}

// ---------- 补救 ----------
// 事情照常发生，但如果手上有东西，还能捞回来一点。
const RES_NAME = { oxygen: "氧气", water: "水", food: "食物", power: "电力", material: "材料" };

function costText(r) {
  const parts = [];
  Object.keys(r.cost).forEach(k => { parts.push(r.cost[k] + " " + (RES_NAME[k] || k)); });
  const back = [];
  Object.keys(r.give).forEach(k => { back.push((RES_NAME[k] || k) + " +" + r.give[k]); });
  return "花 " + parts.join("、") + "，换回 " + back.join("、");
}

function canRemedy(r) {
  if (!r) return false;
  return Object.keys(r.cost).every(k => (G.res[k] || 0) >= r.cost[k]);
}

function applyRemedy() {
  const r = G.remedy;
  if (!r || !canRemedy(r)) return;
  Object.keys(r.cost).forEach(k => { G.res[k] = Math.max(0, G.res[k] - r.cost[k]); });
  Object.keys(r.give).forEach(k => { G.res[k] += r.give[k]; });
  log("补上了。" + costText(r), "ok");
  G.remedy = null;
  G.ask = null;
  clampAll();
  render();
}

function renderRemedy() {
  const night = document.getElementById("night");
  const tx = document.getElementById("nightTx");
  const btn = document.getElementById("nightBtn");
  if (!night || !tx || !btn) return;
  const r = G.remedy;
  if (!r || G.over) { night.classList.add("hide"); return; }
  night.classList.remove("hide");
  tx.textContent = r.text;
  btn.textContent = costText(r);
  btn.disabled = !canRemedy(r) || G.paused;
}

// ---------- 拆 ----------
// 只做一件事：把以后换成现在。不可逆，但随时可以不做。
const TEAR = {
  farm:  { name: "农田",   mat: 90, stress: 8, why: "以后不再种地。" },
  water: { name: "水箱",   mat: 70, stress: 8, why: "以后不再打水。" },
  power: { name: "发电机", mat: 80, stress: 8, why: "以后不再发电。" },
};

function canTear(kind) {
  return !!TEAR[kind] && !G.broken[kind] && !G.over && !G.paused;
}

function dismantle(kind) {
  const t = TEAR[kind];
  if (!canTear(kind)) return;
  G.broken[kind] = true;
  G.res.material += t.mat;
  alive().forEach(p => { p.stress = Math.max(0, p.stress - t.stress); });
  log("把" + t.name + "拆了。材料 +" + t.mat + "，" + t.why + "所有人压力 -" + t.stress + "。", "bad");
  clampAll();
  G.ask = null;
  render();
}

function askTear(kind) {
  const t = TEAR[kind];
  if (!canTear(kind)) return;
  G.ask = {
    kind: kind,
    text: "拆了" + t.name + "。" + t.why + "换 " + t.mat + " 材料，所有人松一口气。",
    note: "这个回不去。",
    ok: "拆",
  };
  render();
}

function renderAsk() {
  const box = document.getElementById("ask");
  if (!box) return;
  if (!G.ask || G.over) { box.classList.remove("show"); return; }
  box.classList.add("show");
  document.getElementById("askText").textContent = G.ask.text;
  document.getElementById("askNote").textContent = G.ask.note;
  document.getElementById("askOk").textContent = G.ask.ok;
}

function nextDay() {
  if (G.over || G.paused) return;
  G.posts = [null, null, null, null];
  G.broken = {};
  G.badStreak = 0;
  G.remedy = null;
  G.ask = null;

  if (!G.awakened && G.theoryTotal >= BAL.revealAt) awaken();

  const s = G.res;
  const pop = Math.max(1, alive().length);
  // 人少了，消耗就小。四个人时是满额，一个人时只剩四分之一。
  const popFactor = pop / 4;
  const mult = popFactor * (G.awakened ? 0.3 : (G.techLevel >= 3 ? 0.85 : 1));

  s.oxygen -= BAL.drain.oxygen * mult;
  s.water  -= BAL.drain.water * mult;
  s.food   -= BAL.drain.food * mult;
  s.power  -= BAL.drain.power * mult;

  if (s.water < 30) s.food -= 5;
  if (s.power < 20) s.oxygen -= 5;

  G.survivors.forEach(p => { if (p.alive) p.stress += BAL.stressPerDay; });
  if (s.water < 20 || s.food < 20) {
    G.survivors.forEach(p => { if (p.alive) p.stress += 6; });
  }

  clampAll();

  // 缺氧
  if (s.oxygen <= 0) {
    G.oxygenDays += 1;
    log("氧气见底了（第 " + G.oxygenDays + " 天）。", "bad");
    if (G.oxygenDays >= BAL.deathOxygenDays) {
      killOne("没撑过去，窒息了。");
      G.oxygenDays = 0;
    }
  } else {
    G.oxygenDays = 0;
  }

  // 饿死
  if (s.food <= 0) {
    G.foodDays += 1;
    if (G.foodDays >= 2) {
      killOne("饿死了。");
      G.foodDays = 0;
    }
  } else {
    G.foodDays = 0;
  }

  // 脱水
  if (s.water <= 0) {
    G.waterDays += 1;
    if (G.waterDays >= 2) {
      killOne("没水喝，走了。");
      G.waterDays = 0;
    }
  } else {
    G.waterDays = 0;
  }

  // 没人了：可能是全灭，也可能是都圆梦走了
  if (alive().length === 0) {
    checkEnd();
    return;
  }

  G.day += 1;
  G.points = BAL.pointsPerDay;
  G.survivors.forEach(p => { p.talked = false; });

  // 昨天那件事，今天就不再是机会了
  G.remedy = null;
  G.ask = null;

  // 夜里出的事
  rollEvent();

  // 士气跟着整体压力走，太低会拖垮所有人
  const living = alive();
  const avg = living.length ? living.reduce((sum, p) => sum + p.stress, 0) / living.length : 0;
  s.morale = Math.max(0, Math.round(100 - avg));
  if (s.morale < 30) {
    G.survivors.forEach(p => { if (p.alive) p.stress += 2; });
    log("屋里没什么人说话了。所有人压力 +2。", "warn");
  }

  // 只剩一个人了：只说一次
  if (!G.lastOneLogged && alive().length === 1) {
    G.lastOneLogged = true;
    const last = alive()[0];
    log("现在就剩 " + last.name + " 一个人了。他自己给自己点名。", "dim");
  }

  // 有人没了，第二天点名会少一个
  if (G.rollCallPending) {
    G.rollCallPending = false;
    const emptyBeds = G.survivors.filter(p => !p.alive && !p.left).length;
    log("点名：" + alive().map(p => p.name).join("、") + "。" + emptyBeds + " 张床空着。", "dim");
  }

  // 愿望说了却一直没圆的人，会嘟囔一句
  const murmur = G.survivors.filter(p => p.alive && p.wishKnown && !p.left);
  if (murmur.length) {
    const mp = murmur[Math.floor(Math.random() * murmur.length)];
    const pool = WISH_MUTTER[mp.wishId] || ["……"];
    log(mp.name + "：" + pool[Math.floor(Math.random() * pool.length)], "dim");
  }

  // 崩溃：每个人崩法不一样
  G.survivors.forEach(p => {
    const limit = p.bond < 30 ? 80 : 100;
    if (!p.alive || p.stress < limit) return;
    p.stress = 60;
    const c = CRASH[p.name];
    if (c) {
      c.apply(G.res, G);
      clampAll();
      log(p.name + " 撑不住了，开始" + c.act + "。" + c.text, "bad");
    } else {
      G.points = Math.max(0, G.points - 1);
      log(p.name + " 撑不住了。", "bad");
    }
  });

  if (s.food <= 0) {
    log("没吃的了。所有人压力 +15。", "bad");
    G.survivors.forEach(p => { if (p.alive) p.stress += 15; });
  }

  render();
}

function awaken() {
  G.awakened = true;
  saveGame();
  log("那天早上，制氧机的读数自己稳住了。没人去修，它就是稳住了。", "sys");
  log("水不掉了，粮食在往外堆。外面还是黑的，但屋里开始像能住的地方。", "sys");
  log("到这一步，才有人明白那些笔记到底在写什么。", "sys");

  // 日志只有两行高，念不完。所以单独开一张纸，把名字一条条摆出来。
  const list = document.getElementById("awakeList");
  if (G.runs.length) {
    list.innerHTML = G.runs.map(function (r, i) {
      return '<div class="r"><b>第 ' + (i + 1) + ' 局</b>，第 ' + r.day + ' 天，<span class="w">' +
        escapeHtml(r.why) + '</span>，走了 ' + r.dead + ' 个人。<span class="ok">—— 他们等到了。</span></div>';
    }).join("");
    G.runs.forEach(function (r, i) {
      log("第 " + (i + 1) + " 局，第 " + r.day + " 天，" + r.why + "，走了 " + r.dead + " 个人。—— 他们等到了。", "ok");
    });
  } else {
    list.innerHTML = '<div class="r">这一次是第一次。没有人等过。</div>';
    log("这一次是第一次。没有人等过。", "ok");
  }
  const box = document.getElementById("awake");
  if (box) box.classList.add("show");
}

function end(title, text) {
  G.over = true;
  G.runs.push({ day: G.day, dead: 4 - alive().length, why: title });
  saveGame();
  document.getElementById("over-title").textContent = title;
  document.getElementById("over-text").textContent = text;
  document.getElementById("over").classList.add("show");
  render();
}

// ---------- 暂停 ----------
document.getElementById("awakeOk").addEventListener("click", () => {
  document.getElementById("awake").classList.remove("show");
});

document.getElementById("pause").addEventListener("click", () => {
  G.paused = !G.paused;
  render();
});

// ---------- 主动结束 ----------
function chooseEnding(kind) {
  const msg = document.getElementById("choiceMsg");
  if (msg) msg.textContent = "";

  if (kind === "cancel" || G.over) {
    document.getElementById("choice").classList.remove("show");
    return;
  }
  if (kind === "restart") {
    try { localStorage.removeItem(RUN_KEY); } catch (e) {}
    location.reload();
    return;
  }

  const n = alive().length;
  const fail = (text) => { if (msg) msg.textContent = text; };

  if (kind === "evac") {
    if (G.res.power < 40 || G.res.material < 60) {
      fail("出口打不开：要 40 电、60 材料。现在只有 " + Math.round(G.res.power) + " 电、" + Math.round(G.res.material) + " 材料。");
      return;
    }
    G.res.power -= 40;
    G.res.material -= 60;
    document.getElementById("choice").classList.remove("show");
    end("撤离", "第 " + G.day + " 天，带着 " + n + " 个人往外走。什么都没带，只带了彼此。");
  } else if (kind === "seal") {
    if (G.res.power < 60) {
      fail("电不够，冻不起来：要 60 电，现在只有 " + Math.round(G.res.power) + " 电。");
      return;
    }
    G.res.power -= 60;
    document.getElementById("choice").classList.remove("show");
    end("封存", "第 " + G.day + " 天，把 " + n + " 个人一个一个送进冷柜。等以后有人来。");
  } else if (kind === "log") {
    document.getElementById("choice").classList.remove("show");
    end("留档", "第 " + G.day + " 天，把这段日子写完了。写到最后一句的时候，还剩 " + n + " 个人。");
  } else if (kind === "stop") {
    document.getElementById("choice").classList.remove("show");
    end("停在这里", "第 " + G.day + " 天。没有解释。");
  }
}

document.getElementById("quit").addEventListener("click", () => {
  if (G.over) return;
  document.getElementById("choice").classList.add("show");
});

document.querySelectorAll("#choice button").forEach(b => {
  b.addEventListener("click", () => chooseEnding(b.dataset.c));
});

document.getElementById("nightBtn").addEventListener("click", applyRemedy);
document.getElementById("askOk").addEventListener("click", () => { if (G.ask) dismantle(G.ask.kind); });
document.getElementById("askNo").addEventListener("click", () => { G.ask = null; render(); });
document.getElementById("next").addEventListener("click", nextDay);

// ---------- 启动 ----------
G.res = Object.assign({}, BAL.start);
if (!loadRun()) fresh();
render();
</script>
